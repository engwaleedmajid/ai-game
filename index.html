<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>تحدي الذكاء الاصطناعي — المنابر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  /* هوية المنابر: كحلي + رصاصي على خلفية فاتحة */
  --navy:#1e5082; --navy2:#163d66; --brand:#283c8f; --blue:#2c64a3; --sky:#4f8fd6; --ice:#eaf1fb;
  --grey:#8f9196; --silver:#eef1f5; --line:#e2e8f0; --line2:#d3dbe6;
  --ink:#0f2038; --text:#1c2c45; --muted:#6b7a90;
  --gold:#c98a00; --ok:#16a34a; --bad:#dc2626;
  --card:#ffffff; --shadow:0 10px 30px rgba(16,40,80,.08); --shadow2:0 4px 14px rgba(16,40,80,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  color:var(--text); min-height:100vh; overflow-x:hidden;
  background:
    radial-gradient(1000px 520px at 88% -12%, rgba(79,143,214,.18), transparent 60%),
    radial-gradient(800px 520px at -10% 112%, rgba(143,145,150,.16), transparent 60%),
    linear-gradient(180deg,#f6f8fc 0%,#e9eef6 100%);
  background-attachment:fixed;
}
button{font-family:inherit;cursor:pointer;border:0}
input{font-family:inherit}
.hidden{display:none!important}
.muted{color:var(--muted)}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;width:100%;box-shadow:var(--shadow)}
.narrow{max-width:460px;text-align:center}
.logo{font-size:56px;line-height:1;margin-bottom:6px}
h1{font-weight:900;font-size:28px;line-height:1.3;color:var(--ink)}
h2{font-weight:900;font-size:22px;color:var(--ink)}
.err{color:var(--bad);min-height:24px;margin-top:10px;font-weight:700}
.field{display:block;width:100%;font-size:18px;padding:14px 16px;border-radius:14px;border:2px solid var(--line2);background:#fff;color:var(--ink);margin-top:12px;text-align:center;outline:none;transition:border-color .15s, box-shadow .15s}
.field:focus{border-color:var(--navy);box-shadow:0 0 0 4px rgba(30,80,130,.12)}
.field::placeholder{color:#9aa7b8}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:14px;font-weight:700;font-size:17px;background:#fff;color:var(--navy);border:1px solid var(--line2);box-shadow:var(--shadow2);transition:transform .08s, filter .15s, background .15s}
.btn:hover{background:var(--ice)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--navy),var(--blue));border:0;color:#fff;box-shadow:0 8px 22px rgba(30,80,130,.30)}
.btn.primary:hover{filter:brightness(1.08);background:linear-gradient(135deg,var(--navy),var(--blue))}
.btn.big{width:100%;font-size:20px;padding:16px;margin-top:16px}
.btn.huge{font-size:clamp(20px,2vw,30px);padding:18px 44px}
.btn.small{font-size:clamp(13px,1vw,16px);padding:8px 14px;border-radius:12px}
.btn.ghost{background:transparent;border:0;box-shadow:none;color:var(--muted);font-size:14px}
.btn:disabled{opacity:.45;pointer-events:none}
.stack{display:flex;flex-direction:column;gap:12px}
.banner{background:var(--ice);border:1px dashed var(--sky);color:var(--navy2);padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.7;margin-bottom:16px;text-align:right}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy2);color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.25)}

/* ---------- الهوية ---------- */
.brand{display:inline-flex;align-items:center}
.brand img{height:54px;width:auto;max-width:100%;display:block}
.brand.lg img{height:clamp(62px,5.6vw,100px)}
.brand.sm img{height:30px}
.brand .bar{width:6px;height:40px;border-radius:4px;background:linear-gradient(var(--navy),var(--grey));margin-inline-end:10px}
.brand .bn{display:flex;flex-direction:column;line-height:1.25;text-align:right}
.brand .bn b{color:var(--brand);font-weight:900}
.brand .bn small{color:var(--grey);font-weight:600}
.brandrow{display:flex;justify-content:center}
.titleline{height:4px;width:120px;margin:10px auto 0;border-radius:4px;background:linear-gradient(90deg,var(--grey),var(--sky),var(--navy))}

/* ---------- عام للهوست ---------- */
.host{min-height:100vh;padding:clamp(16px,2.2vw,34px);display:flex;flex-direction:column;gap:clamp(12px,1.5vw,20px)}
.hhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lhead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.lhead > :first-child{justify-self:start}
.lhead > :last-child{justify-self:end}
.host .title{font-size:clamp(28px,3.3vw,54px);font-weight:900;text-align:center;color:var(--ink)}
.lobby{display:grid;grid-template-columns:minmax(320px,0.9fr) 1.1fr;gap:clamp(16px,3vw,44px);align-items:stretch}
.lobby .left{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.qrbox{background:#fff;padding:18px;border-radius:24px;box-shadow:var(--shadow);border:1px solid var(--line);border-bottom:8px solid var(--navy)}
.qrbox img,.qrbox canvas{display:block;width:min(30vw,48vh,400px)!important;height:auto!important}
.qrfallback{color:#222;font-weight:700;width:300px;padding:30px;line-height:1.8;word-break:break-all}
.joinurl{font-size:clamp(14px,1.15vw,19px);color:var(--muted)}
.joinurl b{color:var(--ink)}
.gamecode{font-size:clamp(20px,2vw,32px);font-weight:700;color:var(--ink)}
.gamecode b{font-size:1.6em;letter-spacing:6px;color:var(--navy)}
.lobby .right{display:flex;flex-direction:column;gap:12px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:var(--shadow)}
.pcount{font-size:clamp(22px,2.4vw,40px);font-weight:900;color:var(--ink)}
.pcount span{color:var(--navy)}
.chips{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;flex:1;overflow:auto;max-height:50vh}
.chip{background:var(--silver);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:700;font-size:clamp(15px,1.3vw,22px);animation:pop .35s ease;display:inline-flex;align-items:center}
.chip .kick{margin-inline-start:8px;background:#fee2e2;border:0;color:var(--bad);border-radius:50%;width:24px;height:24px;font-size:13px;line-height:24px;padding:0;cursor:pointer}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.topbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 16px;font-weight:700;font-size:clamp(14px,1.2vw,20px);box-shadow:var(--shadow2)}
.pill.tag{background:var(--navy);border-color:var(--navy);color:#fff}
.pill.exact{background:#fff7e6;color:#9a6500;border-color:#f5d48a}
.topbar .grow{flex:1}
.qtext{font-size:clamp(24px,2.6vw,44px);font-weight:900;line-height:1.6;white-space:pre-line;background:#fff;color:var(--ink);border-radius:24px;padding:clamp(16px,2vw,32px);box-shadow:var(--shadow);border:1px solid var(--line);border-right:10px solid var(--navy)}
.qtext.long{font-size:clamp(18px,1.85vw,32px);line-height:1.55}
.qtext.small{font-size:clamp(18px,1.7vw,28px)}
.hint{text-align:center;color:var(--navy2);font-weight:700;font-size:clamp(14px,1.15vw,19px)}
.timerrow{display:flex;align-items:center;gap:16px}
.timer{flex:none;width:clamp(70px,6vw,110px);height:clamp(70px,6vw,110px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:clamp(26px,2.6vw,46px);color:#fff;background:linear-gradient(135deg,var(--navy),var(--blue));box-shadow:0 0 0 6px rgba(30,80,130,.15)}
.timer.low{background:var(--bad);box-shadow:0 0 0 6px rgba(220,38,38,.2);animation:pulse 1s infinite}
.timer.paused{background:linear-gradient(135deg,#a9adb4,#7d8189);animation:none}
@keyframes pulse{50%{transform:scale(1.07)}}
.tbar{flex:1;height:14px;border-radius:99px;background:#dfe6ef;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--grey),var(--sky),var(--navy));transition:width .25s linear}
.answerhint{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;background:#fff;border:2px dashed var(--line2);border-radius:20px;padding:clamp(14px,1.6vw,24px);font-size:clamp(18px,1.8vw,30px);font-weight:700;color:var(--ink)}
.answerhint .unit{color:var(--navy);font-weight:900}
.controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.bigans{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;background:#ecfdf3;border:2px solid #86efac;border-radius:22px;padding:clamp(12px,1.4vw,22px)}
.bigans .v{font-size:clamp(34px,4vw,70px);font-weight:900;color:#14532d}
.bigans .r{font-size:clamp(15px,1.4vw,24px);color:#166534;font-weight:700}
.bigans .s{font-size:clamp(15px,1.4vw,24px);font-weight:700;background:#fff;color:var(--ink);padding:6px 14px;border-radius:12px;border:1px solid #bbf7d0}
.anslist{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-height:22vh;overflow:auto}
.achip{border-radius:12px;padding:6px 12px;font-weight:700;font-size:clamp(13px,1.1vw,19px);background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
.achip.ok{background:#f0fdf4;border-color:#bbf7d0;color:#166534}
.achip b{font-weight:900}
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.box{border-radius:20px;padding:clamp(14px,1.6vw,24px);line-height:1.75;font-size:clamp(15px,1.22vw,21px);background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);color:var(--text)}
.box h3{font-size:1.1em;margin-bottom:6px;color:var(--ink)}
.box.sol{border-top:5px solid var(--navy)}
.box.par{border-top:5px solid var(--grey);background:#f8fafd;animation:pop .45s ease}
.ex{margin-top:10px;padding:10px 14px;border-radius:12px;background:var(--ice);border-right:4px solid var(--navy);color:var(--text)}
.ex b{color:var(--navy)}
.steps{padding-inline-start:1.3em;margin:0}
.steps li{margin:4px 0;padding-inline-start:4px}
.steps li::marker{color:var(--navy);font-weight:900}
.board{display:flex;flex-direction:column;gap:10px;max-width:1000px;width:100%;margin:0 auto}
.brow{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 18px;font-size:clamp(17px,1.6vw,28px);font-weight:700;color:var(--ink);box-shadow:var(--shadow2);animation:slide .4s ease both}
.brow .rk{width:2.2em;text-align:center;font-weight:900;color:var(--navy)}
.brow .nm{flex:1}
.brow .sc{font-weight:900;color:var(--navy)}
.brow.top1{background:linear-gradient(90deg,#dbe8f8,#fff);border-color:#bcd2ee}
@keyframes slide{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,2vw,30px);margin-top:4px}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;width:clamp(140px,16vw,240px)}
.pod .av{font-size:clamp(44px,5vw,80px)}
.pod .pn{font-weight:900;font-size:clamp(17px,1.6vw,28px);text-align:center;color:var(--ink)}
.pod .ps{color:var(--muted);font-weight:700}
.pod .blk{width:100%;border-radius:16px 16px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:10px;font-size:clamp(30px,3vw,54px);font-weight:900;color:#fff;animation:rise .9s ease both;box-shadow:var(--shadow)}
.pod.p1 .blk{height:clamp(130px,20vh,230px);background:linear-gradient(#ffd96b,#d99a00)}
.pod.p2 .blk{height:clamp(95px,15vh,170px);background:linear-gradient(#f1f3f6,#b4b9c1);color:#334155;animation-delay:.2s}
.pod.p3 .blk{height:clamp(65px,10vh,120px);background:linear-gradient(#6f9bd3,var(--navy));animation-delay:.4s}
@keyframes rise{from{transform:scaleY(0);transform-origin:bottom}to{transform:scaleY(1);transform-origin:bottom}}
.finalmsg{text-align:center;max-width:1100px;margin:0 auto}
.finalmsg h2{font-size:clamp(26px,3vw,48px);color:var(--navy);margin-bottom:10px}
.finalmsg p{font-size:clamp(16px,1.5vw,25px);line-height:1.9;color:var(--text)}
.skills{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.skill{background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:8px 14px;font-weight:700;font-size:clamp(14px,1.2vw,20px);box-shadow:var(--shadow2)}
.home{max-width:620px}
.qlist{margin-top:16px;text-align:right;max-height:40vh;overflow:auto;font-size:14px;line-height:1.9;color:var(--muted)}
.rules{background:#f6f9fd;border:1px solid var(--line);border-right:4px solid var(--navy);border-radius:14px;padding:10px 16px;line-height:1.75;text-align:right;font-size:clamp(13px,1vw,17px);color:var(--text)}
.rules .rt{font-weight:900;color:var(--navy);margin-bottom:2px}
.rules b{color:var(--ink)}
.breakdown{font-size:15px;color:var(--muted)}
.breakdown b{color:var(--ink)}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:8px;border-radius:16px;background:rgba(255,255,255,.7);border:1px solid var(--line);box-shadow:var(--shadow2)}
.tools button{background:#fff;border:1px solid var(--line2);color:var(--navy);border-radius:10px;padding:7px 12px;font-weight:700;font-size:clamp(12px,.95vw,16px)}
.tools button:hover{background:var(--ice)}
.tools button.warn{border-color:#fca5a5;color:var(--bad)}
.tools button.on{background:#fff7e6;border-color:#f5d48a;color:#9a6500}
.pausebar{text-align:center;font-weight:900;font-size:clamp(20px,2.2vw,36px);color:var(--gold);animation:pulse 1.4s infinite}
.qgrid{display:grid;grid-template-columns:1.15fr 1fr;gap:clamp(12px,1.6vw,24px);align-items:stretch}
.qgrid .qtext{display:flex;align-items:center}
.imgcard{background:#fff;border-radius:24px;padding:clamp(10px,1.2vw,20px);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);border:1px solid var(--line)}
.imgcard svg{width:100%;height:auto;max-height:46vh}
.imgsmall{background:#fff;border-radius:14px;padding:8px;margin-top:10px;display:flex;justify-content:center;border:1px solid var(--line)}
.imgsmall svg{width:100%;max-height:17vh;height:auto}
.secret{background:#fff8e6;border:2px dashed #f2c14e;border-radius:14px;padding:12px 14px;font-weight:700;line-height:1.75;text-align:center;color:#6b4a00}
.secret b{color:#b45309;font-size:1.1em}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

/* ---------- PLAYER ---------- */
.pl{max-width:560px;margin:0 auto;min-height:100vh;padding:14px 14px 18px;display:flex;flex-direction:column;gap:14px}
.phead{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px 14px;box-shadow:var(--shadow2)}
.phead .av{font-size:28px}
.phead .nm{flex:1;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.phead .sc{font-weight:900;color:var(--navy)}
.pbody{flex:1;display:flex;flex-direction:column;gap:14px}
.pmid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:16px 6px}
.pfoot{display:flex;justify-content:center;opacity:.9}
.bigemoji{font-size:80px;line-height:1}
.pq{white-space:pre-line;background:#fff;color:var(--ink);border-radius:18px;padding:16px;font-weight:700;font-size:18px;line-height:1.75;border:1px solid var(--line);box-shadow:var(--shadow2)}
.pqimg{padding:0;overflow:hidden;line-height:0}
.pqimg img{width:100%;height:auto;display:block;pointer-events:none;-webkit-user-drag:none}
.tipbox{background:var(--ice);border:1px solid #cfe0f5;border-radius:14px;padding:10px 14px;font-size:14px;line-height:1.7;color:var(--navy2)}
.tipbox b{color:var(--navy)}
.nocopy,.qtext,.pq,.secret,.clue{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.clue{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border-radius:18px;padding:16px;text-align:center;box-shadow:0 10px 24px rgba(30,80,130,.28);position:relative;overflow:hidden}
.clue::before{content:"";position:absolute;inset:auto -40px -40px auto;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.08)}
.clue .ck{font-size:13px;opacity:.85;font-weight:700}
.clue .cv{font-size:28px;font-weight:900;margin:2px 0 8px}
.clue .ch{font-size:15px;line-height:1.7;background:rgba(255,255,255,.12);border-radius:12px;padding:8px 10px}
.clue .ch b{color:#ffd96b}
.ptimer{display:flex;align-items:center;gap:10px}
.ptimer .timer{width:56px;height:56px;font-size:22px}
.ansbox{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow2)}
.ansrow{display:flex;align-items:center;gap:10px}
.ansrow .field{margin-top:0;font-size:26px;font-weight:900;letter-spacing:1px;direction:ltr}
.ansrow .unit{flex:none;font-weight:900;color:var(--navy);font-size:18px}
.ansnote{font-size:13px;color:var(--muted);margin-top:8px;text-align:center}
.avpick{font-size:64px;background:var(--ice);border:1px solid #cfe0f5;width:100px;height:100px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin:6px auto}
.res{font-size:30px;font-weight:900}
.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}
.pts{font-size:42px;font-weight:900;color:var(--navy)}
.pbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;line-height:1.8;text-align:right;width:100%;color:var(--text);box-shadow:var(--shadow2)}
.pbox.par{background:#f8fafd;border-top:4px solid var(--grey)}
.pbox b{color:var(--ink)}
.myans{font-size:34px;font-weight:900;color:var(--ink);background:var(--ice);border:1px solid #cfe0f5;border-radius:16px;padding:10px 26px}

@media (max-width:900px){
  .lobby{grid-template-columns:1fr}
  .qrbox img,.qrbox canvas{width:min(70vw,320px)!important}
  .boxes{grid-template-columns:1fr}
  .lhead{grid-template-columns:1fr;justify-items:center}
}
</style>
</head>
<body>

}

// يقبل الأرقام العربية والإنجليزية والفواصل
function parseNum(s){
  if(s == null) return null;
  s = String(s)
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/٫/g, '.').replace(/[٬,،\s]/g, '');
  const m = s.match(/-?\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : null;
}

function makeFirebaseDB(){
  if(!window.firebase) throw new Error('firebase-not-loaded');
  firebase.initializeApp(FIREBASE_CONFIG);
  const db = firebase.database();
  let offset = 0;
  db.ref('.info/serverTimeOffset').on('value', s => offset = s.val() || 0);
  return {
    on(path, cb){ const r = db.ref(path); const h = s => cb(s.val()); r.on('value', h); return () => r.off('value', h); },
    get: path => db.ref(path).get().then(s => s.val()),
    set: (path, v) => db.ref(path).set(v),
    update: (path, o) => db.ref(path).update(o),
    remove: path => db.ref(path).remove(),
    now: () => Date.now() + offset,
    ts: () => firebase.database.ServerValue.TIMESTAMP
  };
}
// وضع تجربة: يشتغل بين تبويبات نفس المتصفح فقط (بدون Firebase)
function makeLocalDB(){
  const KEY = 'aiq_local_db';
  const ch = ('BroadcastChannel' in window) ? new BroadcastChannel('aiq_local') : null;
  const load = () => { try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } };
  const parts = p => p.split('/').filter(Boolean);
  const getAt = (d,p) => parts(p).reduce((o,k) => (o == null ? undefined : o[k]), d);
  const setAt = (d,p,v) => {
    const ks = parts(p); let o = d;
    for(let i=0;i<ks.length-1;i++){ if(typeof o[ks[i]] !== 'object' || o[ks[i]] === null) o[ks[i]] = {}; o = o[ks[i]]; }
    const last = ks[ks.length-1];
    if(v === null || v === undefined) delete o[last]; else o[last] = JSON.parse(JSON.stringify(v));
  };
  const subs = new Set();
  function fire(){
    const d = load();
    subs.forEach(s => { const v = getAt(d, s.path); const j = JSON.stringify(v ?? null); if(j !== s.last){ s.last = j; s.cb(v ?? null); } });
  }
  const save = d => { localStorage.setItem(KEY, JSON.stringify(d)); fire(); if(ch) ch.postMessage(1); };
  if(ch) ch.onmessage = fire;
  window.addEventListener('storage', e => { if(e.key === KEY) fire(); });
  return {
    on(path, cb){ const s = {path, cb, last: undefined}; subs.add(s); setTimeout(fire, 0); return () => subs.delete(s); },
    get: async path => getAt(load(), path) ?? null,
    set: async (path, v) => { const d = load(); setAt(d, path, v); save(d); },
    update: async (path, o) => { const d = load(); for(const k in o) setAt(d, path + '/' + k, o[k]); save(d); },
    remove: async path => { const d = load(); setAt(d, path, null); save(d); },
    now: () => Date.now(),
    ts: () => Date.now()
  };
}

async function hostUndo(qi){
  if(qi < 0) return;
  const code = H.code;
  const results = (await DB.get(`games/${code}/results/${qi}`)) || {};
  const players = (await DB.get(`games/${code}/players`)) || {};
  const up = {};
  for(const pid in results){ if(players[pid]) up[`players/${pid}/score`] = Math.max(0, (players[pid].score || 0) - ((results[pid] && results[pid].pts) || 0)); }
  up[`answers/${qi}`] = null; up[`results/${qi}`] = null; up[`reveal/${qi}`] = null;
  await DB.update(`games/${code}`, up);
}

function hostLive(){
  const st = H.state; if(!st) return;
  const nPlayers = Object.keys(H.players).length;
  if(st.phase === 'lobby'){
    const pc = $('#pc'); if(pc) pc.textContent = nPlayers;
    const chips = $('#chips');
    if(chips){
      const have = new Set([...chips.children].map(c => c.dataset.id));
      Object.entries(H.players).sort((a,b)=>(a[1].joinedAt||0)-(b[1].joinedAt||0)).forEach(([id,p]) => {
        if(have.has(id)) return;
        const c = document.createElement('span'); c.className='chip'; c.dataset.id=id; c.textContent = `${p.avatar||'🙂'} ${p.name}`;
        const k = document.createElement('button'); k.className='kick'; k.title='إخراج'; k.textContent='✕'; k.onclick = () => hostKick(id); c.appendChild(k);
        chips.appendChild(c);
      });
      [...chips.children].forEach(c => { if(!H.players[c.dataset.id]) c.remove(); });
    }
  }
  const nAns = Object.keys(H.answers).length;
  const ac = $('#acount'); if(ac) ac.textContent = `${nAns} / ${nPlayers} جاوبوا`;
  if(st.phase === 'question' && nPlayers > 0 && nAns >= nPlayers && H.autoRevealed !== st.q){
    H.autoRevealed = st.q; setTimeout(hostReveal, 1200);
  }
  if(st.phase === 'reveal'){
    const q = QUESTIONS[st.q], R = st.ans || rangeOf(q, nPlayers), lo = R.min, hi = R.max;
    const rows = Object.entries(H.answers).map(([pid,a]) => ({ p: H.players[pid] || {}, v: a ? a.value : null, ok: inRange(a ? a.value : null, lo, hi) }))
      .sort((a,b) => Math.abs((a.v ?? 1e18) - R.answer) - Math.abs((b.v ?? 1e18) - R.answer));
    const okN = rows.filter(r => r.ok).length;
    const oc = $('#okcount'); if(oc) oc.textContent = `${okN} من ${nAns} جاوبوا صح`;
    const al = $('#anslist'); if(al) al.innerHTML = rows.map(r => `<span class="achip ${r.ok?'ok':''}">${esc(r.p.avatar||'🙂')} ${esc(r.p.name||'')}: <b dir="ltr">${fmt(r.v)}</b></span>`).join('');
  }
}
async function hostStartQ(qi){
  const q = QUESTIONS[qi];
  await DB.update(`games/${H.code}/state`, { phase:'question', q:qi, startedAt: DB.ts(), duration: q.time || 120, showParallel:false, ans: null, solText: null, paused: false, pausedAt: null });
}
async function hostReveal(){
  const st = H.state;
  if(!st || st.phase !== 'question' || H.revealing) return;
  H.revealing = true;
  try{
    const qi = st.q, q = QUESTIONS[qi], code = H.code;
    const answers = (await DB.get(`games/${code}/answers/${qi}`)) || {};
    const players = (await DB.get(`games/${code}/players`)) || {};
    const nP = Object.keys(players).length;
    const R = rangeOf(q, nP), lo = R.min, hi = R.max, solText = textOf(q.solution, nP);
    const start = st.startedAt, dur = st.duration * 1000, deadline = start + dur + 2500;
    const up = {};
    for(const pid in answers){
      const a = answers[pid] || {};
      const at = a.at || start;
      const ok = inRange(a.value, lo, hi) && at <= deadline;
      const frac = Math.max(0, Math.min(1, 1 - (at - start) / dur));
      const speed = ok ? Math.round(POINTS_SPEED * frac) : 0;
      const pts = ok ? POINTS_BASE + speed : 0;
      up[`results/${qi}/${pid}`] = { pts, base: ok ? POINTS_BASE : 0, speed, correct: ok, value: a.value ?? null };
      if(players[pid]) up[`players/${pid}/score`] = (players[pid].score || 0) + pts;
    }
    up[`reveal/${qi}`] = { answer: R.answer, min: lo, max: hi, exact: R.exact, unit: q.unit || '', solution: solText, steps: q.steps || null, parallel: q.parallel || '', example: q.example || '' };
    up['state/paused'] = false;
    up['state/ans'] = R;
    up['state/solText'] = solText;
    up['state/phase'] = 'reveal';
    up['state/showParallel'] = false;
    await DB.update(`games/${code}`, up);
  }catch(e){ toast('صار خطأ في الكشف، جرّب مرة ثانية'); }
  H.revealing = false;
}

async function playerAttach(code, me){
  P.code = code; P.me = me; P.seen = false;
  app.innerHTML = `<div class="center"><div class="bigemoji">⏳</div></div>`;
  const st = await DB.get(`games/${code}/state`).catch(()=>null);
  if(!st){ store.pdel('aiq_p_' + code); return playerJoinForm('', 'اللعبة هذي انتهت أو الكود غلط'); }
  const rec = await DB.get(`games/${code}/players/${me.pid}`).catch(()=>null);
  if(!rec) await DB.set(`games/${code}/players/${me.pid}`, { name: me.name, avatar: me.avatar, score: 0, joinedAt: DB.ts() });
  P.subs.push(DB.on(`games/${code}/questions`, q => { P.questions = q; playerRender(); }));
  P.subs.push(DB.on(`games/${code}/players`, p => {
    P.players = p || {};
    if(P.players[me.pid]) P.seen = true;
    else if(P.seen){ playerLeave('تم إخراجك من اللعبة'); return; }
    playerLive();
  }));
  P.subs.push(DB.on(`games/${code}/state`, s => {
    P.state = s;
    if(!s){ playerLeave('اللعبة انتهت 👋'); return; }
    playerOnState();
  }));
}
function playerLeave(msg){
  P.subs.forEach(f=>f()); P.subs = []; P.qsubs.forEach(f=>f()); P.qsubs = [];

}
function playerOnState(){
  const st = P.state;
  if(P.qOf !== st.q){
    P.qsubs.forEach(f=>f()); P.qsubs = [];
    P.qOf = st.q; P.myAnswer = null; P.result = null; P.reveal = null; P.timeUp = false;
    if(st.q >= 0){
      const b = `games/${P.code}`;
      P.qsubs.push(DB.on(`${b}/answers/${st.q}/${P.me.pid}`, a => { P.myAnswer = a; playerRender(); }));
      P.qsubs.push(DB.on(`${b}/results/${st.q}/${P.me.pid}`, r => { P.result = r; playerRender(); }));
      P.qsubs.push(DB.on(`${b}/reveal/${st.q}`, r => { P.reveal = r; playerRender(); }));
    }
  }
  if(st.phase === 'question' && remaining(st) > 0) P.timeUp = false;
  playerRender();
}

  }
  else if(st.phase === 'reveal' && q){
    const r = P.result, rv = P.reveal;
    const head = r ? (r.correct ? `<div class="bigemoji">🎉</div><div class="res ok">إجابة صحيحة!</div><div class="pts">+${r.pts}</div><div class="breakdown">${r.base ?? POINTS_BASE} إجابة صحيحة + <b>${r.speed ?? (r.pts - POINTS_BASE)}</b> بونص سرعة ⚡</div>`
                               : `<div class="bigemoji">😅</div><div class="res bad">للأسف… برّا الهامش</div>`)
                   : `<div class="bigemoji">⏰</div><div class="res bad">ما جاوبت</div>`;
    body = `<div class="pmid">${head}
      ${r ? `<div class="muted">إجابتك: <b dir="ltr" style="color:var(--ink)">${fmt(r.value)}</b> ${unit}</div>` : ''}
      ${rv ? `<div class="pbox"><b>الإجابة الصحيحة: ${fmt(rv.answer)} ${unit}</b> <span class="muted">${rv.exact ? '(دقيق)' : `(المقبول ${fmt(rv.min)} – ${fmt(rv.max)})`}</span><div class="muted" style="margin-top:6px"><b style="color:var(--ink)">🧠 طريقة التفكير:</b>${stepsHTML(rv.steps, rv.solution)}</div></div>` : ''}
      ${rv && st.showParallel ? `<div class="pbox par"><b>🔗 وش علاقتها بشغلنا؟</b><br>${esc(rv.parallel)}${rv.example ? `<div class="ex"><b>💡 مثال:</b> ${esc(rv.example)}</div>` : ''}</div>` : ''}
    </div>`;
  }
  else if(st.phase === 'board'){
    const {rank, total} = myRank();
    body = `<div class="pmid"><div class="bigemoji">${rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':'📊'}</div>
      <h2 id="rankline">ترتيبك ${rank} من ${total}</h2><div class="pts" id="bigscore">${myScore()}</div><p class="muted">انتظر السؤال الجاي…</p></div>`;
  }
  else if(st.phase === 'final'){
    const {rank, total} = myRank();
    body = `<div class="pmid"><div class="bigemoji">${rank===1?'🏆':rank<=3?'🎖️':'👏'}</div>
      <h2>ترتيبك النهائي: ${rank} من ${total}</h2><div class="pts">${myScore()} نقطة</div>
      <div class="pbox par"><b>${esc(FINAL_MESSAGE.title)}</b><br>${esc(FINAL_MESSAGE.body)}</div></div>`;
    if(rank && rank <= 3) setTimeout(startConfetti, 100);
  }
  else {
    body = `<div class="pmid"><div class="bigemoji">⏳</div></div>`;
  }
  app.innerHTML = `<div class="pl">${header()}<div class="pbody">${body}</div><div class="pfoot">${brandHTML('sm')}</div></div>`;

  const af = $('#af');
  if(af){
    if(typing) $('#ans').value = typing;
    af.onsubmit = e => { e.preventDefault(); playerAnswer(); };
  }
  if($('#qimg')) drawQuestion(q.text);
  tick();
}
function playerLive(){
  const s = $('#myscore'); if(s) s.textContent = myScore() + ' نقطة';
  const pc = $('#pcount'); if(pc) pc.textContent = Object.keys(P.players).length + ' لاعب داخل';
  if(P.state && P.state.phase === 'board'){
    const {rank,total} = myRank(); const rl = $('#rankline'); if(rl) rl.textContent = `ترتيبك ${rank} من ${total}`;
    const bs = $('#bigscore'); if(bs) bs.textContent = myScore();
  }
}
async function playerAnswer(){
  const st = P.state;
  if(P.myAnswer || P.sending || !st || st.phase !== 'question' || st.paused || remaining(st) <= 0) return;
  const raw = $('#ans').value.trim();
  const v = parseNum(raw);
  if(v == null){ $('#aerr').textContent = 'اكتب رقم 🙏'; return; }
  P.sending = true;
  P.myAnswer = { value: v }; playerRender(true);
  try{ await DB.set(`games/${P.code}/answers/${st.q}/${P.me.pid}`, { value: v, raw: raw.slice(0,40), at: DB.ts() }); }
  catch(e){ P.myAnswer = null; playerRender(true); toast('ما وصلت إجابتك، جرّب مرة ثانية'); }
  P.sending = false;
}
// يرسم نص السؤال كصورة عشان ما ينسخ — اللاعب لازم يكتب سؤاله للذكاء الاصطناعي بنفسه
async function drawQuestion(text){
  const img = $('#qimg'); if(!img) return;
  try{ if(document.fonts) await Promise.race([document.fonts.load('700 44px Cairo'), new Promise(r => setTimeout(r, 1500))]); }catch(e){}
  const W = 880, pad = 40, fs = 44, lh = fs * 1.7;
  const cv = document.createElement('canvas'); const ctx = cv.getContext('2d');
  const font = `700 ${fs}px Cairo, "Segoe UI", Tahoma, sans-serif`;
  ctx.font = font; ctx.direction = 'rtl';
  const lines = [];
  String(text).split('\n').forEach(par => {
    let line = '';
    par.split(/\s+/).filter(Boolean).forEach(w => {
      const t = line ? line + ' ' + w : w;
      if(ctx.measureText(t).width > W - pad*2 - 12 && line){ lines.push(line); line = w; } else line = t;
    });
    lines.push(line);
  });
  cv.width = W; cv.height = Math.ceil(pad*2 + lines.length * lh);
  const c = cv.getContext('2d');
  c.fillStyle = '#ffffff'; c.fillRect(0, 0, cv.width, cv.height);
  c.fillStyle = '#1e5082'; c.fillRect(W - 12, 0, 12, cv.height);
  c.font = font; c.direction = 'rtl'; c.textAlign = 'right'; c.textBaseline = 'middle'; c.fillStyle = '#0f2038';
  lines.forEach((l, i) => c.fillText(l, W - pad - 12, pad + lh * i + lh / 2));
  if($('#qimg') === img) img.src = cv.toDataURL('image/png');
}
function copyText(t){
  const done = () => toast('تم النسخ ✅ الصقه في تطبيق الذكاء الاصطناعي');
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){ toast('ما قدرنا ننسخ — انسخه يدوي'); } ta.remove(); };
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(done, fallback); else fallback();
}

/* ============================== مؤقت ============================== */
function tick(){
  const st = IS_HOST ? H.state : P.state;
  if(!st || st.phase !== 'question' || !st.startedAt) return;
  const total = st.duration * 1000, rem = remaining(st);
  const el = $('#timer'); if(el){ el.textContent = st.paused ? '⏸️' : Math.ceil(rem/1000); el.classList.toggle('low', rem < 10000 && !st.paused); el.classList.toggle('paused', !!st.paused); }
  const b = $('#tbar'); if(b) b.style.width = Math.max(0, Math.min(100, rem/total*100)) + '%';
  if(IS_HOST && rem <= 0 && H.autoRevealed !== st.q){ H.autoRevealed = st.q; hostReveal(); }
  if(!IS_HOST && rem <= 0 && !P.myAnswer && !P.timeUp){ P.timeUp = true; playerRender(true); }
}
setInterval(tick, 250);

/* ============================== احتفال ============================== */
let confettiRAF = null;
function startConfetti(){
  const cv = document.getElementById('confetti'); cv.classList.remove('hidden');
  const ctx = cv.getContext('2d'); const W = cv.width = innerWidth, Hh = cv.height = innerHeight;
  const cols = ['#1e5082','#4f8fd6','#8f9196','#d3dbe6','#ffd96b','#2c64a3'];
  const ps = Array.from({length:160}, () => ({ x:Math.random()*W, y:-Math.random()*Hh, w:6+Math.random()*8, h:8+Math.random()*10, vy:2+Math.random()*3, vx:-1+Math.random()*2, r:Math.random()*6, vr:-.1+Math.random()*.2, c:cols[Math.floor(Math.random()*cols.length)] }));
  let frames = 0;
  cancelAnimationFrame(confettiRAF);
  (function loop(){
    ctx.clearRect(0,0,W,Hh);
    ps.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; if(p.y>Hh && frames<420) { p.y=-10; p.x=Math.random()*W; }
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); });
    frames++;
    if(frames < 700) confettiRAF = requestAnimationFrame(loop); else stopConfetti();
  })();
}
function stopConfetti(){ cancelAnimationFrame(confettiRAF); const cv = document.getElementById('confetti'); if(cv) cv.classList.add('hidden'); }

/* ============================== تشغيل ============================== */
document.addEventListener('keydown', e => {
  if(!IS_HOST || !H.state || (e.target && e.target.tagName === 'INPUT')) return;
  if(e.code === 'Space' && H.state.phase === 'question'){ e.preventDefault(); H.state.paused ? hostResume() : hostPause(); }
  if(e.key === 'f' || e.key === 'F') toggleFull();
});
['copy','cut','contextmenu','dragstart'].forEach(ev => document.addEventListener(ev, e => {
  if(e.target && e.target.closest && e.target.closest('input')) return;
  e.preventDefault();
}));
if(DB){
  if(IS_HOST) hostInit(); else playerInit();
}
</script>
