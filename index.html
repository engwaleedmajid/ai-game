<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>تحدي الذكاء الاصطناعي — المنابر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  /* هوية المنابر: تدرج أزرق ورصاصي */
  --navy:#0b0f33; --navy2:#1b2363; --brand:#293280; --blue:#3446b8; --sky:#6f86f0; --ice:#d4dbff;
  --steel:#6b6866; --grey:#a4a09e; --silver:#e6e3e1;
  --ink:#1b2363; --muted:#b4b6cc;
  --accent:#a5b4ff; --gold:#ffc94d; --ok:#22c55e; --bad:#ef4444;
  --glass:rgba(255,255,255,.07); --line:rgba(212,219,255,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  color:#fff; min-height:100vh; overflow-x:hidden;
  background:
    radial-gradient(900px 600px at 90% -10%, rgba(111,134,240,.30), transparent 60%),
    radial-gradient(800px 600px at -10% 110%, rgba(164,160,158,.32), transparent 60%),
    linear-gradient(155deg, var(--navy) 0%, var(--navy2) 45%, #393c57 80%, #5e5b59 100%);
  background-attachment:fixed;
}
button{font-family:inherit;cursor:pointer;border:0}
input{font-family:inherit}
.hidden{display:none!important}
.muted{color:var(--muted)}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:28px;backdrop-filter:blur(8px);width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.narrow{max-width:440px;text-align:center}
.logo{font-size:60px;line-height:1;margin-bottom:8px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35))}
h1{font-weight:900;font-size:28px;line-height:1.3}
h2{font-weight:900;font-size:22px}
.err{color:#fecaca;min-height:24px;margin-top:10px;font-weight:600}
.field{display:block;width:100%;font-size:18px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:rgba(3,15,32,.45);color:#fff;margin-top:12px;text-align:center;outline:none}
.field:focus{border-color:var(--sky)}
.field::placeholder{color:#7f93ad}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:14px;font-weight:700;font-size:17px;background:rgba(255,255,255,.1);color:#fff;border:1px solid var(--line);transition:transform .08s, filter .15s}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--blue),var(--sky));border:0;color:#fff;box-shadow:0 8px 24px rgba(52,70,184,.5)}
.btn.big{width:100%;font-size:20px;padding:16px;margin-top:16px}
.btn.huge{font-size:clamp(20px,2vw,30px);padding:18px 40px}
.btn.ghost{background:transparent;border:0;color:var(--muted);font-size:14px}
.btn:disabled{opacity:.45;pointer-events:none}
.stack{display:flex;flex-direction:column;gap:12px}
.banner{background:rgba(111,134,240,.12);border:1px dashed rgba(111,134,240,.6);color:var(--ice);padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.7;margin-bottom:16px;text-align:right}
.steps{padding-inline-start:1.3em;margin:0}
.steps li{margin:4px 0;padding-inline-start:4px}
.steps li::marker{color:var(--accent);font-weight:900}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:8px;border-radius:16px;background:rgba(0,0,0,.22);border:1px solid var(--line)}
.tools button{background:rgba(255,255,255,.08);border:1px solid var(--line);color:#fff;border-radius:10px;padding:7px 12px;font-weight:700;font-size:clamp(12px,.95vw,16px)}
.tools button:hover{background:rgba(255,255,255,.18)}
.tools button.warn{border-color:rgba(239,68,68,.5)}
.tools button.on{background:rgba(255,201,77,.25);border-color:rgba(255,201,77,.7)}
.timer.paused{background:linear-gradient(135deg,#a4a09e,#6b6866);animation:none}
.pausebar{text-align:center;font-weight:900;font-size:clamp(20px,2.2vw,36px);color:var(--gold);animation:pulse 1.4s infinite}
.chip .kick{margin-inline-start:8px;background:rgba(239,68,68,.25);border:0;color:#fff;border-radius:50%;width:24px;height:24px;font-size:13px;line-height:24px;padding:0;cursor:pointer}
.qgrid{display:grid;grid-template-columns:1.15fr 1fr;gap:clamp(12px,1.6vw,24px);align-items:stretch}
.qgrid .qtext{display:flex;align-items:center}
.imgcard{background:#fff;border-radius:24px;padding:clamp(10px,1.2vw,20px);display:flex;align-items:center;justify-content:center;box-shadow:0 14px 40px rgba(0,0,0,.35);border-bottom:8px solid var(--grey)}
.imgcard svg{width:100%;height:auto;max-height:46vh}
.imgsmall{background:#fff;border-radius:14px;padding:8px;margin-top:10px;display:flex;justify-content:center}
.imgsmall svg{width:100%;max-height:17vh;height:auto}
.secret{background:rgba(255,201,77,.13);border:2px dashed rgba(255,201,77,.6);border-radius:14px;padding:12px 14px;font-weight:700;line-height:1.75;text-align:center;color:#fff3cf}
.secret b{color:var(--gold);font-size:1.15em}
.rules{background:rgba(0,0,0,.2);border:1px solid var(--line);border-right:4px solid var(--sky);border-radius:14px;padding:10px 16px;line-height:1.75;text-align:right;font-size:clamp(13px,1vw,17px)}
.rules .rt{font-weight:900;color:var(--accent);margin-bottom:2px}
.rules b{color:#fff}
.breakdown{font-size:15px;color:var(--muted)}
.breakdown b{color:#fff}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#06142a;border:1px solid var(--line);color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.4)}

/* ---------- الهوية ---------- */
.brand{display:inline-flex;align-items:center;gap:10px;font-weight:700;color:var(--silver)}
.brand .plate{background:#fff;border-radius:12px;padding:5px 10px;display:inline-flex;box-shadow:0 6px 18px rgba(0,0,0,.25);border-bottom:3px solid var(--grey)}
.brand .plate img{height:58px;width:auto;display:block}
.brand.lg .plate{padding:10px 20px;border-radius:18px}
.brand.lg .plate img{height:clamp(80px,7.5vw,130px)}
.brand .bn{display:flex;flex-direction:column;line-height:1.25;text-align:right}
.brand .bn b{font-size:1.05em;color:#fff;font-weight:900}
.brand .bn small{font-size:.78em;color:var(--grey);font-weight:600}
.brand .bar{width:6px;align-self:stretch;border-radius:4px;background:linear-gradient(var(--sky),var(--blue),var(--grey))}
.brandrow{display:flex;justify-content:center}
.brand.lg{font-size:clamp(16px,1.4vw,24px)}
.titleline{height:4px;width:120px;margin:10px auto 0;border-radius:4px;background:linear-gradient(90deg,var(--grey),var(--sky),var(--blue))}

/* ---------- HOST ---------- */
.host{min-height:100vh;padding:clamp(16px,2.4vw,36px);display:flex;flex-direction:column;gap:clamp(12px,1.6vw,22px)}
.lhead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.lhead > :first-child{justify-self:start}
.hhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.host .title{font-size:clamp(28px,3.4vw,56px);font-weight:900;text-align:center}
.lobby{display:grid;grid-template-columns:minmax(320px,0.9fr) 1.1fr;gap:clamp(16px,3vw,48px);align-items:stretch}
.lobby .left{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.qrbox{background:#fff;padding:18px;border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.45);border-bottom:8px solid var(--brand)}
.qrbox img,.qrbox canvas{display:block;width:min(32vw,50vh,400px)!important;height:auto!important}
.qrfallback{color:#222;font-weight:700;width:300px;padding:30px;line-height:1.8;word-break:break-all}
.joinurl{font-size:clamp(14px,1.2vw,20px);color:var(--muted)}
.joinurl b{color:#fff}
.gamecode{font-size:clamp(20px,2vw,32px);font-weight:700}
.gamecode b{font-size:1.6em;letter-spacing:6px;color:var(--accent)}
.lobby .right{display:flex;flex-direction:column;gap:12px;background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:24px}
.pcount{font-size:clamp(22px,2.4vw,40px);font-weight:900}
.pcount span{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;flex:1;overflow:auto;max-height:55vh}
.chip{background:rgba(212,219,255,.12);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:700;font-size:clamp(15px,1.3vw,22px);animation:pop .35s ease}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.topbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-weight:700;font-size:clamp(14px,1.2vw,20px)}
.pill.tag{background:rgba(111,134,240,.16);color:var(--accent)}
.pill.exact{background:rgba(255,201,77,.15);color:var(--gold);border-color:rgba(255,201,77,.4)}
.topbar .grow{flex:1}
.qtext{font-size:clamp(24px,2.7vw,46px);font-weight:900;line-height:1.6;white-space:pre-line;background:linear-gradient(180deg,#ffffff,#f1f0f5);color:var(--ink);border-radius:24px;padding:clamp(16px,2vw,32px);box-shadow:0 14px 40px rgba(0,0,0,.35);border-right:10px solid var(--brand)}
.qtext.long{font-size:clamp(18px,1.85vw,32px);line-height:1.55}
.qtext.small{font-size:clamp(18px,1.8vw,30px)}
.hint{text-align:center;color:var(--ice);font-weight:700;font-size:clamp(14px,1.2vw,20px)}
.timerrow{display:flex;align-items:center;gap:16px}
.timer{flex:none;width:clamp(70px,6vw,110px);height:clamp(70px,6vw,110px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:clamp(26px,2.6vw,46px);background:linear-gradient(135deg,var(--blue),var(--sky));box-shadow:0 0 0 6px rgba(111,134,240,.25)}
.timer.low{background:var(--bad);box-shadow:0 0 0 6px rgba(239,68,68,.35);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.tbar{flex:1;height:14px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--grey),var(--sky),var(--blue));transition:width .25s linear}
.answerhint{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;background:var(--glass);border:1px dashed rgba(212,219,255,.4);border-radius:20px;padding:clamp(14px,1.6vw,26px);font-size:clamp(18px,1.8vw,30px);font-weight:700}
.answerhint .unit{color:var(--accent);font-weight:900}
.controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.bigans{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;background:linear-gradient(135deg,rgba(34,197,94,.22),rgba(111,134,240,.15));border:2px solid rgba(34,197,94,.55);border-radius:22px;padding:clamp(12px,1.4vw,22px)}
.bigans .v{font-size:clamp(34px,4vw,70px);font-weight:900}
.bigans .r{font-size:clamp(15px,1.4vw,24px);color:var(--ice);font-weight:700}
.bigans .s{font-size:clamp(15px,1.4vw,24px);font-weight:700;background:rgba(0,0,0,.2);padding:6px 14px;border-radius:12px}
.anslist{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-height:22vh;overflow:auto}
.achip{border-radius:12px;padding:6px 12px;font-weight:700;font-size:clamp(13px,1.1vw,19px);background:rgba(239,68,68,.18);border:1px solid rgba(239,68,68,.45)}
.achip.ok{background:rgba(34,197,94,.2);border-color:rgba(34,197,94,.55)}
.achip b{font-weight:900}
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.box{border-radius:20px;padding:clamp(14px,1.6vw,24px);line-height:1.75;font-size:clamp(15px,1.25vw,22px)}
.ex{margin-top:10px;padding:10px 14px;border-radius:12px;background:rgba(0,0,0,.18);border-right:4px solid var(--grey)}
.ex b{color:var(--ice)}
.box h3{font-size:1.1em;margin-bottom:6px}
.box.sol{background:rgba(111,134,240,.1);border:1px solid rgba(111,134,240,.4)}
.box.par{background:rgba(164,160,158,.16);border:1px solid rgba(230,227,225,.45);animation:pop .45s ease}
.board{display:flex;flex-direction:column;gap:10px;max-width:1000px;width:100%;margin:0 auto}
.brow{display:flex;align-items:center;gap:14px;background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:12px 18px;font-size:clamp(17px,1.6vw,28px);font-weight:700;animation:slide .4s ease both}
.brow .rk{width:2.2em;text-align:center;font-weight:900;color:var(--accent)}
.brow .nm{flex:1}
.brow .sc{font-weight:900}
.brow.top1{background:linear-gradient(90deg,rgba(111,134,240,.35),rgba(29,95,209,.12))}
@keyframes slide{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,2vw,30px);margin-top:4px}
.pod{display:flex;flex-direction:column;align-items:center;gap:8px;width:clamp(140px,16vw,240px)}
.pod .av{font-size:clamp(44px,5vw,80px)}
.pod .pn{font-weight:900;font-size:clamp(17px,1.6vw,28px);text-align:center}
.pod .ps{color:var(--muted);font-weight:700}
.pod .blk{width:100%;border-radius:16px 16px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:10px;font-size:clamp(30px,3vw,54px);font-weight:900;animation:rise .9s ease both}
.pod.p1 .blk{height:clamp(130px,20vh,230px);background:linear-gradient(#ffe08a,#e0a400)}
.pod.p2 .blk{height:clamp(95px,15vh,170px);background:linear-gradient(#f3f1f0,#a4a09e);color:#1e293b;animation-delay:.2s}
.pod.p3 .blk{height:clamp(65px,10vh,120px);background:linear-gradient(#8fa0f5,#293280);animation-delay:.4s}
@keyframes rise{from{transform:scaleY(0);transform-origin:bottom}to{transform:scaleY(1);transform-origin:bottom}}
.finalmsg{text-align:center;max-width:1100px;margin:0 auto}
.finalmsg h2{font-size:clamp(26px,3vw,50px);color:var(--accent);margin-bottom:10px}
.finalmsg p{font-size:clamp(16px,1.5vw,26px);line-height:1.9}
.skills{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.skill{background:rgba(212,219,255,.1);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:700;font-size:clamp(14px,1.2vw,20px)}
.home{max-width:620px}
.qlist{margin-top:16px;text-align:right;max-height:40vh;overflow:auto;font-size:14px;line-height:1.9;color:var(--muted)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

/* ---------- PLAYER ---------- */
.pl{max-width:560px;margin:0 auto;min-height:100vh;padding:14px 14px 20px;display:flex;flex-direction:column;gap:14px}
.phead{display:flex;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:8px 14px}
.phead .av{font-size:28px}
.phead .nm{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.phead .sc{font-weight:900;color:var(--accent)}
.pbody{flex:1;display:flex;flex-direction:column;gap:14px}
.pmid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:20px 6px}
.pfoot{text-align:center;font-size:12px;color:var(--grey);opacity:.85}
.bigemoji{font-size:84px;line-height:1}
.pq{white-space:pre-line;background:linear-gradient(180deg,#fff,#f1f0f5);color:var(--ink);border-radius:18px;padding:16px;font-weight:700;font-size:18px;line-height:1.75;border-right:6px solid var(--brand)}
.pqimg{padding:0;overflow:hidden;line-height:0}
.pqimg img{width:100%;height:auto;display:block;pointer-events:none;-webkit-user-drag:none}
.tipbox{background:rgba(111,134,240,.12);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:14px;line-height:1.7;color:var(--ice)}
.tipbox b{color:#fff}
.nocopy,.qtext,.pq,.secret{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ptimer{display:flex;align-items:center;gap:10px}
.ptimer .timer{width:56px;height:56px;font-size:22px}
.ansbox{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:14px}
.ansrow{display:flex;align-items:center;gap:10px}
.ansrow .field{margin-top:0;font-size:26px;font-weight:900;letter-spacing:1px;direction:ltr}
.ansrow .unit{flex:none;font-weight:900;color:var(--accent);font-size:18px}
.ansnote{font-size:13px;color:var(--muted);margin-top:8px;text-align:center}
.avpick{font-size:64px;background:rgba(212,219,255,.1);border:1px solid var(--line);width:100px;height:100px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin:6px auto}
.res{font-size:30px;font-weight:900}
.res.ok{color:#86efac}.res.bad{color:#fca5a5}
.pts{font-size:42px;font-weight:900;color:var(--accent)}
.pbox{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:16px;padding:14px;line-height:1.8;text-align:right;width:100%}
.pbox.par{background:rgba(164,160,158,.16);border-color:rgba(230,227,225,.45)}
.myans{font-size:34px;font-weight:900;background:rgba(111,134,240,.14);border:1px solid rgba(111,134,240,.45);border-radius:16px;padding:10px 26px}

@media (max-width:900px){
  .lobby{grid-template-columns:1fr}
  .qrbox img,.qrbox canvas{width:min(70vw,320px)!important}
  .boxes{grid-template-columns:1fr}
}
</style>
</head>
<body>

const isExact = q => q.min == null && q.max == null;
const isDynamic = q => typeof q.answer === 'function';
// الإجابة والمدى المقبول (n = عدد اللاعبين، للأسئلة اللي تعتمد عليه)
function rangeOf(q, n){
  const a = isDynamic(q) ? q.answer(n) : q.answer;
  if(isExact(q)) return { answer:a, min:a, max:a, exact:true };
  return { answer:a, min: q.min ?? a, max: q.max ?? a, exact:false };
}
const textOf = (x, n) => typeof x === 'function' ? x(n) : (x || '');
const fmt = n => (n == null || isNaN(n)) ? '—' : Number(n).toLocaleString('en-US', { maximumFractionDigits: 2 });
// يقبل الأرقام العربية والإنجليزية والفواصل
function parseNum(s){
  if(s == null) return null;
  s = String(s)
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/٫/g, '.').replace(/[٬,،\s]/g, '');
  const m = s.match(/-?\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : null;
}
const inRange = (v, lo, hi) => v != null && v >= lo - 1e-9 && v <= hi + 1e-9;

function makeFirebaseDB(){
  if(!window.firebase) throw new Error('firebase-not-loaded');
  firebase.initializeApp(FIREBASE_CONFIG);
  const db = firebase.database();
  let offset = 0;
  db.ref('.info/serverTimeOffset').on('value', s => offset = s.val() || 0);
  return {
    on(path, cb){ const r = db.ref(path); const h = s => cb(s.val()); r.on('value', h); return () => r.off('value', h); },
    get: path => db.ref(path).get().then(s => s.val()),
    set: (path, v) => db.ref(path).set(v),
    update: (path, o) => db.ref(path).update(o),
    remove: path => db.ref(path).remove(),
    now: () => Date.now() + offset,
    ts: () => firebase.database.ServerValue.TIMESTAMP
  };
}
// وضع تجربة: يشتغل بين تبويبات نفس المتصفح فقط (بدون Firebase)
function makeLocalDB(){
  const KEY = 'aiq_local_db';
  const ch = ('BroadcastChannel' in window) ? new BroadcastChannel('aiq_local') : null;
  const load = () => { try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } };
  const parts = p => p.split('/').filter(Boolean);
  const getAt = (d,p) => parts(p).reduce((o,k) => (o == null ? undefined : o[k]), d);
  const setAt = (d,p,v) => {
    const ks = parts(p); let o = d;
    for(let i=0;i<ks.length-1;i++){ if(typeof o[ks[i]] !== 'object' || o[ks[i]] === null) o[ks[i]] = {}; o = o[ks[i]]; }
    const last = ks[ks.length-1];
    if(v === null || v === undefined) delete o[last]; else o[last] = JSON.parse(JSON.stringify(v));
  };
  const subs = new Set();
  function fire(){
    const d = load();
    subs.forEach(s => { const v = getAt(d, s.path); const j = JSON.stringify(v ?? null); if(j !== s.last){ s.last = j; s.cb(v ?? null); } });
  }
  const save = d => { localStorage.setItem(KEY, JSON.stringify(d)); fire(); if(ch) ch.postMessage(1); };
  if(ch) ch.onmessage = fire;
  window.addEventListener('storage', e => { if(e.key === KEY) fire(); });
  return {
    on(path, cb){ const s = {path, cb, last: undefined}; subs.add(s); setTimeout(fire, 0); return () => subs.delete(s); },
    get: async path => getAt(load(), path) ?? null,
    set: async (path, v) => { const d = load(); setAt(d, path, v); save(d); },
    update: async (path, o) => { const d = load(); for(const k in o) setAt(d, path + '/' + k, o[k]); save(d); },
    remove: async path => { const d = load(); setAt(d, path, null); save(d); },
    now: () => Date.now(),
    ts: () => Date.now()
  };
}

async function hostCreate(){

async function hostUndo(qi){

  const results = (await DB.get(`games/${code}/results/${qi}`)) || {};
  const players = (await DB.get(`games/${code}/players`)) || {};
  const up = {};

  up[`answers/${qi}`] = null; up[`results/${qi}`] = null; up[`reveal/${qi}`] = null;
  await DB.update(`games/${code}`, up);
}

async function hostStartQ(qi){

async function hostReveal(){
  const st = H.state;
  if(!st || st.phase !== 'question' || H.revealing) return;
  H.revealing = true;
  try{
    const qi = st.q, q = QUESTIONS[qi], code = H.code;
    const answers = (await DB.get(`games/${code}/answers/${qi}`)) || {};
    const players = (await DB.get(`games/${code}/players`)) || {};
    const nP = Object.keys(players).length;
    const R = rangeOf(q, nP), lo = R.min, hi = R.max, solText = textOf(q.solution, nP);
    const start = st.startedAt, dur = st.duration * 1000, deadline = start + dur + 2500;
    const up = {};
    for(const pid in answers){
      const a = answers[pid] || {};
      const at = a.at || start;
      const ok = inRange(a.value, lo, hi) && at <= deadline;
      const frac = Math.max(0, Math.min(1, 1 - (at - start) / dur));
      const speed = ok ? Math.round(POINTS_SPEED * frac) : 0;
      const pts = ok ? POINTS_BASE + speed : 0;
      up[`results/${qi}/${pid}`] = { pts, base: ok ? POINTS_BASE : 0, speed, correct: ok, value: a.value ?? null };
      if(players[pid]) up[`players/${pid}/score`] = (players[pid].score || 0) + pts;
    }
    up[`reveal/${qi}`] = { answer: R.answer, min: lo, max: hi, exact: R.exact, unit: q.unit || '', solution: solText, steps: q.steps || null, parallel: q.parallel || '', example: q.example || '' };
    up['state/paused'] = false;
    up['state/ans'] = R;
    up['state/solText'] = solText;
    up['state/phase'] = 'reveal';
    up['state/showParallel'] = false;
    await DB.update(`games/${code}`, up);
  }catch(e){ toast('صار خطأ في الكشف، جرّب مرة ثانية'); }
  H.revealing = false;
}

    e.preventDefault();
    const c = String(parseNum($('#code').value) ?? '').trim(), name = $('#nm').value.trim().replace(/\s+/g,' ');
    if(!c) return $('#err').textContent = 'اكتب كود اللعبة';
    if(!name) return $('#err').textContent = 'اكتب اسم مستعار';
    $('#go').disabled = true; $('#err').textContent = '';
    try{
      const st = await DB.get(`games/${c}/state`);
      if(!st){ $('#go').disabled = false; return $('#err').textContent = 'ما لقينا لعبة بهذا الكود 🤔'; }
      const pid = 'p' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-3);
      const me = { pid, name, avatar };
      await DB.set(`games/${c}/players/${pid}`, { name, avatar, score:0, joinedAt: DB.ts() });
      store.pset('aiq_p_' + c, me);
      try{ history.replaceState(null, '', '?g=' + c + (params.has('local') ? '&local' : '')); }catch(_){}
      playerAttach(c, me);
    }catch(err){ $('#go').disabled = false; $('#err').textContent = 'صار خطأ في الاتصال، جرّب مرة ثانية'; }
  };
}
async function playerAttach(code, me){
  P.code = code; P.me = me; P.seen = false;
  app.innerHTML = `<div class="center"><div class="bigemoji">⏳</div></div>`;
  const st = await DB.get(`games/${code}/state`).catch(()=>null);
  if(!st){ store.pdel('aiq_p_' + code); return playerJoinForm('', 'اللعبة هذي انتهت أو الكود غلط'); }
  const rec = await DB.get(`games/${code}/players/${me.pid}`).catch(()=>null);
  if(!rec) await DB.set(`games/${code}/players/${me.pid}`, { name: me.name, avatar: me.avatar, score: 0, joinedAt: DB.ts() });
  P.subs.push(DB.on(`games/${code}/questions`, q => { P.questions = q; playerRender(); }));
  P.subs.push(DB.on(`games/${code}/players`, p => {
    P.players = p || {};
    if(P.players[me.pid]) P.seen = true;
    else if(P.seen){ playerLeave('تم إخراجك من اللعبة'); return; }
    playerLive();
  }));
  P.subs.push(DB.on(`games/${code}/state`, s => {
    P.state = s;
    if(!s){ playerLeave('اللعبة انتهت 👋'); return; }
    playerOnState();
  }));
}
function playerLeave(msg){
  P.subs.forEach(f=>f()); P.subs = []; P.qsubs.forEach(f=>f()); P.qsubs = [];
  store.pdel('aiq_p_' + P.code);
  playerJoinForm('', msg);
}
function playerOnState(){
  const st = P.state;
  if(P.qOf !== st.q){
    P.qsubs.forEach(f=>f()); P.qsubs = [];
    P.qOf = st.q; P.myAnswer = null; P.result = null; P.reveal = null; P.timeUp = false;
    if(st.q >= 0){
      const b = `games/${P.code}`;
      P.qsubs.push(DB.on(`${b}/answers/${st.q}/${P.me.pid}`, a => { P.myAnswer = a; playerRender(); }));
      P.qsubs.push(DB.on(`${b}/results/${st.q}/${P.me.pid}`, r => { P.result = r; playerRender(); }));
      P.qsubs.push(DB.on(`${b}/reveal/${st.q}`, r => { P.reveal = r; playerRender(); }));
    }
  }
  if(st.phase === 'question' && remaining(st) > 0) P.timeUp = false;
  playerRender();
}
function myPiece(q){
  if(!q || !q.pieces || !q.pieces.length) return null;
  const order = Object.entries(P.players).sort((a,b) => ((a[1].joinedAt||0) - (b[1].joinedAt||0)) || (a[0] < b[0] ? -1 : 1)).map(e => e[0]);
  const i = Math.max(0, order.indexOf(P.me.pid));
  return q.pieces[i % q.pieces.length];
}
function myScore(){ const p = P.players[P.me.pid]; return p ? (p.score || 0) : 0; }
function myRank(){ const l = rankList(P.players); const i = l.findIndex(p => p.id === P.me.pid); return { rank: i + 1, total: l.length }; }
function header(){
  return `<div class="phead"><span class="av">${esc(P.me.avatar)}</span><span class="nm">${esc(P.me.name)}</span><span class="sc" id="myscore">${myScore()} نقطة</span></div>`;
}
function playerRender(force){
  const st = P.state; if(!st || !P.me) return;
  const key = [st.phase, st.q, st.paused ? 'P' : '', P.myAnswer ? P.myAnswer.value : '-', P.result ? 1 : 0, P.reveal ? 1 : 0, st.showParallel ? 1 : 0, P.timeUp ? 1 : 0, P.questions ? 1 : 0].join('|');
  if(key === P.key && !force){ playerLive(); return; }
  // لا تمسح اللي يكتبه اللاعب إذا تغيّر شي ثانوي أثناء السؤال
  const typing = $('#ans') ? $('#ans').value : null;
  P.key = key;
  stopConfetti();
  const q = (P.questions && st.q >= 0) ? P.questions[st.q] : null;
  const nQ = P.questions ? P.questions.length : 0;
  const unit = q && q.unit ? esc(q.unit) : '';
  let body = '';

  if(st.phase === 'lobby'){
    body = `<div class="pmid">${brandHTML()}<div class="bigemoji">✅</div><h2>أنت داخل!</h2>
      <p class="muted" style="line-height:1.8">انتظر الهوست يبدأ اللعبة…<br>وجهّز تطبيق الذكاء الاصطناعي في جوالك 🤖</p>
      <div class="pill" id="pcount">${Object.keys(P.players).length} لاعب داخل</div>${rulesHTML()}</div>`;
  }
  else if(st.phase === 'question' && q){
    if(P.myAnswer){
      body = `<div class="pmid"><div class="bigemoji">🔒</div><h2>وصلت إجابتك!</h2>
        <div class="myans"><span dir="ltr">${fmt(P.myAnswer.value)}</span> ${unit}</div>
        <p class="muted">انتظر الكشف… 🤞</p>
        <div class="ptimer"><div class="timer" id="timer"></div></div></div>`;
    } else if(P.timeUp){
      body = `<div class="pmid"><div class="bigemoji">⏰</div><h2>خلص الوقت!</h2><p class="muted">انتظر الكشف…</p></div>`;
    } else {
      body = `<div class="topbar"><span class="pill">سؤال ${st.q+1} من ${nQ}</span><span class="pill tag">${esc(q.tag)}</span>${q.exact ? `<span class="pill exact">🎯 دقيق</span>` : ''}</div>
        <div class="ptimer"><div class="timer" id="timer"></div><div class="tbar"><i id="tbar"></i></div></div>
        ${st.paused ? `<div class="secret">⏸️ الهوست وقّف الوقت مؤقتاً… كمّل تفكير 😉</div>` : ''}
        <div class="pq pqimg"><img id="qimg" alt="السؤال" draggable="false"></div>
        ${q.image ? `<div class="secret">📸 السؤال فيه رسمة على <b>الشاشة الكبيرة</b> — صوّرها وأرسلها للذكاء الاصطناعي مع السؤال</div>` : ''}
        ${myPiece(q) ? `<div class="secret">🧩 معلومتك السرية: <b>${esc(myPiece(q))}</b><br>باقي المعلومات عند غيرك… دوّر عليهم!</div>` : ''}
        <div class="tipbox">🔒 النسخ مقفول 😉<br>✍️ <b>اكتب سؤالك للذكاء الاصطناعي بأسلوبك:</b> وش المعطيات؟ وش المطلوب بالضبط؟ وبأي وحدة؟</div>
        <form class="ansbox" id="af" autocomplete="off">
          <div class="ansrow"><input id="ans" class="field" inputmode="decimal" placeholder="اكتب الرقم">${unit ? `<span class="unit">${unit}</span>` : ''}</div>
          <button class="btn big primary" id="send" style="margin-top:12px" ${st.paused ? 'disabled' : ''}>${st.paused ? '⏸️ الإرسال متوقف' : 'أرسل الإجابة ✅'}</button>
          <div class="ansnote">${q.exact ? '🎯 هذا السؤال جوابه لازم يكون دقيق' : '↔️ فيه هامش بسيط للخطأ'} — تقدر ترسل مرة وحدة بس</div>
          <p id="aerr" class="err" style="margin-top:4px"></p>
        </form>`;
    }
  }
  else if(st.phase === 'reveal' && q){
    const r = P.result, rv = P.reveal;
    const head = r ? (r.correct ? `<div class="bigemoji">🎉</div><div class="res ok">إجابة صحيحة!</div><div class="pts">+${r.pts}</div><div class="breakdown">${r.base ?? POINTS_BASE} إجابة صحيحة + <b>${r.speed ?? (r.pts - POINTS_BASE)}</b> بونص سرعة ⚡</div>`
                               : `<div class="bigemoji">😅</div><div class="res bad">للأسف… برّا الهامش</div>`)
                   : `<div class="bigemoji">⏰</div><div class="res bad">ما جاوبت</div>`;
    body = `<div class="pmid">${head}
      ${r ? `<div class="muted">إجابتك: <b dir="ltr" style="color:#fff">${fmt(r.value)}</b> ${unit}</div>` : ''}
      ${rv ? `<div class="pbox"><b>الإجابة الصحيحة: ${fmt(rv.answer)} ${unit}</b> <span class="muted">${rv.exact ? '(دقيق)' : `(المقبول ${fmt(rv.min)} – ${fmt(rv.max)})`}</span><div class="muted" style="margin-top:6px"><b style="color:#fff">🧠 طريقة التفكير:</b>${stepsHTML(rv.steps, rv.solution)}</div></div>` : ''}
      ${rv && st.showParallel ? `<div class="pbox par"><b>🔗 وش علاقتها بشغلنا؟</b><br>${esc(rv.parallel)}${rv.example ? `<div class="ex"><b>💡 مثال:</b> ${esc(rv.example)}</div>` : ''}</div>` : ''}
    </div>`;
  }
  else if(st.phase === 'board'){
    const {rank, total} = myRank();
    body = `<div class="pmid"><div class="bigemoji">${rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':'📊'}</div>
      <h2 id="rankline">ترتيبك ${rank} من ${total}</h2><div class="pts" id="bigscore">${myScore()}</div><p class="muted">انتظر السؤال الجاي…</p></div>`;
  }
  else if(st.phase === 'final'){
    const {rank, total} = myRank();
    body = `<div class="pmid"><div class="bigemoji">${rank===1?'🏆':rank<=3?'🎖️':'👏'}</div>
      <h2>ترتيبك النهائي: ${rank} من ${total}</h2><div class="pts">${myScore()} نقطة</div>
      <div class="pbox par"><b>${esc(FINAL_MESSAGE.title)}</b><br>${esc(FINAL_MESSAGE.body)}</div></div>`;
    if(rank && rank <= 3) setTimeout(startConfetti, 100);
  }
  else {
    body = `<div class="pmid"><div class="bigemoji">⏳</div></div>`;
  }
  app.innerHTML = `<div class="pl">${header()}<div class="pbody">${body}</div><div class="pfoot">${esc(BRAND.name)} ${esc(BRAND.full)}</div></div>`;

  const af = $('#af');
  if(af){
    if(typing) $('#ans').value = typing;
    af.onsubmit = e => { e.preventDefault(); playerAnswer(); };
  }
  if($('#qimg')) drawQuestion(q.text);
  tick();
}
function playerLive(){
  const s = $('#myscore'); if(s) s.textContent = myScore() + ' نقطة';
  const pc = $('#pcount'); if(pc) pc.textContent = Object.keys(P.players).length + ' لاعب داخل';
  if(P.state && P.state.phase === 'board'){
    const {rank,total} = myRank(); const rl = $('#rankline'); if(rl) rl.textContent = `ترتيبك ${rank} من ${total}`;
    const bs = $('#bigscore'); if(bs) bs.textContent = myScore();
  }
}
async function playerAnswer(){
  const st = P.state;
  if(P.myAnswer || P.sending || !st || st.phase !== 'question' || st.paused || remaining(st) <= 0) return;
  const raw = $('#ans').value.trim();
  const v = parseNum(raw);
  if(v == null){ $('#aerr').textContent = 'اكتب رقم 🙏'; return; }
  P.sending = true;
  P.myAnswer = { value: v }; playerRender(true);
  try{ await DB.set(`games/${P.code}/answers/${st.q}/${P.me.pid}`, { value: v, raw: raw.slice(0,40), at: DB.ts() }); }
  catch(e){ P.myAnswer = null; playerRender(true); toast('ما وصلت إجابتك، جرّب مرة ثانية'); }
  P.sending = false;
}
// يرسم نص السؤال كصورة عشان ما ينسخ — اللاعب لازم يكتب سؤاله للذكاء الاصطناعي بنفسه
async function drawQuestion(text){
  const img = $('#qimg'); if(!img) return;
  try{ if(document.fonts) await Promise.race([document.fonts.load('700 44px Cairo'), new Promise(r => setTimeout(r, 1500))]); }catch(e){}
  const W = 880, pad = 40, fs = 44, lh = fs * 1.7;
  const cv = document.createElement('canvas'); const ctx = cv.getContext('2d');
  const font = `700 ${fs}px Cairo, "Segoe UI", Tahoma, sans-serif`;
  ctx.font = font; ctx.direction = 'rtl';
  const lines = [];
  String(text).split('\n').forEach(par => {
    let line = '';
    par.split(/\s+/).filter(Boolean).forEach(w => {
      const t = line ? line + ' ' + w : w;
      if(ctx.measureText(t).width > W - pad*2 - 12 && line){ lines.push(line); line = w; } else line = t;
    });
    lines.push(line);
  });
  cv.width = W; cv.height = Math.ceil(pad*2 + lines.length * lh);
  const c = cv.getContext('2d');
  c.fillStyle = '#ffffff'; c.fillRect(0, 0, cv.width, cv.height);
  c.fillStyle = '#293280'; c.fillRect(W - 12, 0, 12, cv.height);
  c.font = font; c.direction = 'rtl'; c.textAlign = 'right'; c.textBaseline = 'middle'; c.fillStyle = '#1b2363';
  lines.forEach((l, i) => c.fillText(l, W - pad - 12, pad + lh * i + lh / 2));
  if($('#qimg') === img) img.src = cv.toDataURL('image/png');
}
function copyText(t){
  const done = () => toast('تم النسخ ✅ الصقه في تطبيق الذكاء الاصطناعي');
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){ toast('ما قدرنا ننسخ — انسخه يدوي'); } ta.remove(); };
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(done, fallback); else fallback();
}

/* ============================== مؤقت ============================== */
function tick(){
  const st = IS_HOST ? H.state : P.state;
  if(!st || st.phase !== 'question' || !st.startedAt) return;
  const total = st.duration * 1000, rem = remaining(st);
  const el = $('#timer'); if(el){ el.textContent = st.paused ? '⏸️' : Math.ceil(rem/1000); el.classList.toggle('low', rem < 10000 && !st.paused); el.classList.toggle('paused', !!st.paused); }
  const b = $('#tbar'); if(b) b.style.width = Math.max(0, Math.min(100, rem/total*100)) + '%';
  if(IS_HOST && rem <= 0 && H.autoRevealed !== st.q){ H.autoRevealed = st.q; hostReveal(); }
  if(!IS_HOST && rem <= 0 && !P.myAnswer && !P.timeUp){ P.timeUp = true; playerRender(true); }
}
setInterval(tick, 250);

/* ============================== احتفال ============================== */
let confettiRAF = null;
function startConfetti(){
  const cv = document.getElementById('confetti'); cv.classList.remove('hidden');
  const ctx = cv.getContext('2d'); const W = cv.width = innerWidth, Hh = cv.height = innerHeight;
  const cols = ['#293280','#6f86f0','#a4a09e','#e6e3e1','#ffffff','#ffc94d'];
  const ps = Array.from({length:160}, () => ({ x:Math.random()*W, y:-Math.random()*Hh, w:6+Math.random()*8, h:8+Math.random()*10, vy:2+Math.random()*3, vx:-1+Math.random()*2, r:Math.random()*6, vr:-.1+Math.random()*.2, c:cols[Math.floor(Math.random()*cols.length)] }));
  let frames = 0;
  cancelAnimationFrame(confettiRAF);
  (function loop(){
    ctx.clearRect(0,0,W,Hh);
    ps.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; if(p.y>Hh && frames<420) { p.y=-10; p.x=Math.random()*W; }
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); });
    frames++;
    if(frames < 700) confettiRAF = requestAnimationFrame(loop); else stopConfetti();
  })();
}
function stopConfetti(){ cancelAnimationFrame(confettiRAF); const cv = document.getElementById('confetti'); if(cv) cv.classList.add('hidden'); }

/* ============================== تشغيل ============================== */
document.addEventListener('keydown', e => {
  if(!IS_HOST || !H.state || (e.target && e.target.tagName === 'INPUT')) return;
  if(e.code === 'Space' && H.state.phase === 'question'){ e.preventDefault(); H.state.paused ? hostResume() : hostPause(); }
  if(e.key === 'f' || e.key === 'F') toggleFull();
});
['copy','cut','contextmenu','dragstart'].forEach(ev => document.addEventListener(ev, e => {
  if(e.target && e.target.closest && e.target.closest('input')) return;
  e.preventDefault();
}));
if(DB){
  if(IS_HOST) hostInit(); else playerInit();
}
</script>
</body>
